[package]
name = "local-live-captions"
version = "0.1.16"
description = "Private offline captions for desktop audio"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "local_live_captions_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
tauri = { version = "=2.8.4", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15.3"
whisper-rs = "0.16.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
