name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && github.ref || inputs.tag }}
      - id: release
        name: Resolve immutable release source
        shell: bash
        run: |
          test -n "$RELEASE_TAG"
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          test -n "$commit"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    runs-on: ubuntu-22.04
    env:
      CI: 1
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag, source commit, and package versions
        run: npm run verify:release-source
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake file libclang-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev pulseaudio pulseaudio-utils
      - run: npm ci
      - name: Install the pinned Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:browser-lifecycle
      - run: npm test
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:linux-audio
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  build:
    needs: [resolve, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Set macOS deployment target
        if: matrix.platform == 'macos-latest'
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      - name: Install Linux libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake file libclang-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev pulseaudio-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
        with:
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: Local Live Captions ${{ needs.resolve.outputs.tag }}
          releaseBody: "Unsigned desktop builds. Audio and speech recognition stay on the device."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  manifest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FACTORY_RELEASE_TOKEN }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Verify manifest source identity
        run: npm run verify:release-source
      - name: Download release assets
        run: gh release download "$RELEASE_TAG" --dir release-assets
      - name: Make checksums and update manifest
        working-directory: release-assets
        run: |
          rm -f SHA256SUMS latest.json
          sha256sum * > SHA256SUMS
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets | jq --arg commit "$RELEASE_COMMIT" '{version:.tagName,commit:$commit,assets:[.assets[]|{name:.name,url:.url}]}' > latest.json
          gh release upload "$RELEASE_TAG" SHA256SUMS latest.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify the published release contract
        run: node scripts/verify-published-release.mjs --expected-tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT" --attempts 12
